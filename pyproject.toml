[project]
name = "ai-workshop-systems"
version = "0.1.0"
description = "AI Systems Platform Monorepo"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "apps",
    "packages"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
