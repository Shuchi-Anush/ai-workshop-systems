[project]
name = "ai-workshop-systems"
version = "0.1.0"
description = "AI Systems Platform Monorepo"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "ai-contracts",
    "ai-errors",
    "ai-observability",
    "ai-testing",
    "ai-vector",
    "resume-analyzer",
    "langchain>=1.3.9",
    "langchain-ollama>=1.1.0",
]

[tool.uv.sources]
ai-contracts = { workspace = true }
ai-errors = { workspace = true }
ai-observability = { workspace = true }
ai-testing = { workspace = true }
ai-vector = { workspace = true }
resume-analyzer = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/*"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
    "apps",
    "packages"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
