[project]
name = "ai-vector"
version = "0.1.0"
description = "Internal package for ai-vector"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "ai-contracts"
]

[tool.uv.sources]
ai-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
