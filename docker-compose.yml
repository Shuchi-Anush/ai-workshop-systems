services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_workshop_api
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./task_01_resume_rag:/app/task_01_resume_rag
      - ./shared:/app/shared
      - ./packages:/app/packages
      - ./tests:/app/tests
      - ai_workshop_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "pytest", "tests/"]

  ollama:
    image: ollama/ollama:latest
    container_name: ai_workshop_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:15-alpine
    container_name: ai_workshop_postgres
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai_workshop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai_workshop_data:
  ollama_models:
  postgres_data:
  redis_data:
