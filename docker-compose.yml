version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8081:8081"
    environment:
      - WORKSPACE_ENV=production
      - OLLAMA_HOST=http://host.docker.internal:11434
    volumes:
      - ./.data:/app/.data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dashboard:
    build: 
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8081
    depends_on:
      - api
    restart: unless-stopped
