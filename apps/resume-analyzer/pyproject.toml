[project]
name = "resume-analyzer"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-contracts",
    "ai-vector",
    "ai-observability",
    "ai-testing",
    "fastapi",
    "pydantic",
    "pytest",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "chromadb>=1.5.9",
    "langchain>=1.3.9",
    "langchain-ollama>=1.1.0",
    "pypdf>=6.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps"]

[tool.uv.sources]
ai-contracts = { workspace = true }
ai-vector = { workspace = true }
ai-observability = { workspace = true }
ai-testing = { workspace = true }
