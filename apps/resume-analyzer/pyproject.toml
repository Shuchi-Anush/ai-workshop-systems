[project]
name = "resume-analyzer"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ai-contracts",
    "ai-vector",
    "ai-observability",
    "ai-testing",
    "fastapi",
    "pydantic",
    "pytest"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apps"]

[tool.uv.sources]
ai-contracts = { workspace = true }
ai-vector = { workspace = true }
ai-observability = { workspace = true }
ai-testing = { workspace = true }
